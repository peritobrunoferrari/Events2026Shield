name: Shield Sentinel Emulator Smoke Test

on:
  push:
    paths:
      - "shield-sentinel/**"
      - ".github/workflows/shield-sentinel-emulator.yml"
  workflow_dispatch:
    inputs:
      api-level:
        description: "API level da imagem do emulador"
        default: "36"

permissions:
  contents: read

jobs:
  emulator:
    name: Emulador Android (API ${{ github.event.inputs.api-level || '36' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.0.0 platform-tools"
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@v4

      - name: APK debug
        working-directory: shield-sentinel
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Emulador + smoke test (sem wipe, sem reboot)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api-level || '36' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: shield-sentinel/tools/emulator/smoke-test.sh shield-sentinel/app/build/outputs/apk/debug/app-debug.apk emulator-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-results
          path: emulator-results/
          if-no-files-found: warn
