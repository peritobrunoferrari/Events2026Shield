name: Shield Sentinel Emulator Smoke Test

on:
  push:
    paths:
      - "shield-sentinel/**"
      - ".github/workflows/shield-sentinel-emulator.yml"
  workflow_dispatch:

permissions:
  contents: write   # publica os resultados (screenshots/logs) no branch ci-emulator-results

jobs:
  emulator:
    name: Emulador Android (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # API 34: dpm set-device-owner funciona em imagem AOSP → exige Device Owner.
          - api: 34
            require_do: "1"
          # API 36: set-device-owner funciona após alguns segundos de boot (o serviço
          # calcula "hasIncompatibleAccounts" de forma assíncrona); há fallback adb root.
          - api: 36
            require_do: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.0.0 platform-tools"
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@v4

      - name: APK debug
        working-directory: shield-sentinel
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Emulador + smoke test (sem wipe, sem reboot)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          # Imagem AOSP: sem contas pré-existentes (google_apis bloqueia dpm set-device-owner).
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            REQUIRE_DO=${{ matrix.require_do }} shield-sentinel/tools/emulator/smoke-test.sh shield-sentinel/app/build/outputs/apk/debug/app-debug.apk emulator-results
            shield-sentinel/tools/emulator/instrumented-test.sh shield-sentinel "$PWD/emulator-results"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-results-api${{ matrix.api }}
          path: emulator-results/
          if-no-files-found: warn

      - name: Publicar resultados no branch ci-emulator-results-api${{ matrix.api }}
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          [ -d emulator-results ] || exit 0
          cd emulator-results
          git init -q
          git checkout -q -b ci-emulator-results-api${{ matrix.api }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "run=${GITHUB_RUN_ID} sha=${GITHUB_SHA} api=${{ matrix.api }}" > RUN.txt
          git add -A
          git commit -qm "Smoke test ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-emulator-results-api${{ matrix.api }}
