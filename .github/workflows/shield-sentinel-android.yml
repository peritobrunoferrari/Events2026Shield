name: Shield Sentinel Android CI

on:
  push:
    paths:
      - "shield-sentinel/**"
      - ".github/workflows/shield-sentinel-android.yml"
  pull_request:
    paths:
      - "shield-sentinel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-verify:
    name: core-logic tests + Android type-check (sem SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shield-sentinel/tools/jvm-verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :core-logic-jvm:test :android-typecheck:compileKotlin :admin-cli:installDist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-logic-test-results
          path: shield-sentinel/tools/jvm-verify/core-logic-jvm/build/test-results/

  android-build:
    name: APK debug (compileSdk 37.1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shield-sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.0.0 platform-tools"
          accept-android-sdk-licenses: true
      - name: Platforms disponíveis no sdkmanager (diagnóstico)
        run: sdkmanager --list 2>/dev/null | grep -E "platforms;android-3[6-9]" || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes unitários
        run: ./gradlew --no-daemon :core-logic:test
      - name: APK debug (o AGP baixa o platform android-37.x se necessário)
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: APK release (R8; não assinado quando não há keystore configurada)
        run: ./gradlew --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: shield-sentinel-debug-apk
          path: shield-sentinel/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: shield-sentinel-release-apk-unsigned
          path: shield-sentinel/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
