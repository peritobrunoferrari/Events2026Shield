name: Shield Sentinel Android CI

on:
  push:
    paths:
      - "shield-sentinel/**"
      - ".github/workflows/shield-sentinel-android.yml"
  pull_request:
    paths:
      - "shield-sentinel/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-verify:
    name: core-logic tests + Android type-check (sem SDK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shield-sentinel/tools/jvm-verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :core-logic-jvm:test :android-typecheck:compileKotlin :admin-cli:installDist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-logic-test-results
          path: shield-sentinel/tools/jvm-verify/core-logic-jvm/build/test-results/

  android-build:
    name: APK debug (compileSdk ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    # API 36 é obrigatório; API 37 (Android 17) é opcional até o platform ser
    # publicado no sdkmanager (hoje "Failed to find package platforms;android-37").
    continue-on-error: ${{ matrix.sdk == 37 }}
    strategy:
      fail-fast: false
      matrix:
        sdk: [36, 37]
    defaults:
      run:
        working-directory: shield-sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-${{ matrix.sdk }} build-tools;36.0.0 platform-tools"
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes unitários
        run: ./gradlew --no-daemon -PsentinelCompileSdk=${{ matrix.sdk }} -PsentinelTargetSdk=${{ matrix.sdk }} :core-logic:test
      - name: APK debug
        run: ./gradlew --no-daemon -PsentinelCompileSdk=${{ matrix.sdk }} -PsentinelTargetSdk=${{ matrix.sdk }} :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: shield-sentinel-debug-apk-sdk${{ matrix.sdk }}
          path: shield-sentinel/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
