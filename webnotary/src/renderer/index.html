<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:">
<title>WebNotary</title>
<style>
:root{--bg:#1e2230;--bg2:#2a2f40;--fg:#e8eaf0;--muted:#9aa3b8;--acc:#4f8cff;--rec:#e53935;--ok:#43a047;--warn:#fb8c00}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
#toolbar{height:92px;display:flex;flex-direction:column;gap:6px;padding:6px 10px;background:var(--bg)}
.row{display:flex;align-items:center;gap:6px}
button{background:var(--bg2);color:var(--fg);border:1px solid #3a4157;border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--acc)}button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}button.rec{background:var(--rec);border-color:var(--rec);color:#fff}
input[type=text],input[type=password],input[type=url],input[type=number],textarea,select{background:#141722;color:var(--fg);border:1px solid #3a4157;border-radius:6px;padding:6px 8px;font:inherit}
#url{flex:1;min-width:200px}
#status{display:flex;align-items:center;gap:10px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:#555;display:inline-block}.dot.on{background:var(--rec);animation:p 1s infinite}@keyframes p{50%{opacity:.3}}
#panel{position:fixed;inset:92px 0 0 0;background:#f5f6fa;color:#1c1f2a;overflow:auto;padding:24px;display:none}
#panel.show{display:block}
.card{background:#fff;border:1px solid #dde1ec;border-radius:10px;padding:18px 20px;margin:0 auto 16px;max-width:980px}
.card h2{margin:0 0 10px;font-size:16px}.card h3{margin:14px 0 6px;font-size:13px;color:#445}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#445}label input,label select,label textarea{color:#111;background:#fff;border-color:#c9cfdd}
.panel-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.panel-actions button{background:#e9ecf5;color:#1c1f2a;border-color:#c9cfdd}.panel-actions button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}.panel-actions button.rec{background:var(--rec);color:#fff;border-color:var(--rec)}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{border-bottom:1px solid #e3e6ef;padding:6px;text-align:left;vertical-align:top}code{font-family:ui-monospace,Consolas,monospace;font-size:11px;word-break:break-all}
pre{background:#f0f2f8;padding:10px;border-radius:8px;white-space:pre-wrap;font-size:12px}
.msg{padding:8px 10px;border-radius:6px;margin-top:8px}.msg.ok{background:#e6f4ea;color:#1b5e20}.msg.err{background:#fdecea;color:#b71c1c}.msg.info{background:#e8f0fe;color:#174ea6}
.hint{color:#667;font-size:12px}
</style>
</head>
<body>
<div id="toolbar">
  <div class="row">
    <button id="b-voltar" title="Voltar">◀</button><button id="b-avancar" title="Avançar">▶</button><button id="b-recarregar" title="Recarregar">⟳</button>
    <input id="url" type="text" placeholder="Digite um endereço (ex.: web.whatsapp.com) e pressione Enter">
    <button id="b-ir">Ir</button>
    <button id="b-arquivo" title="Abrir arquivo local (imagem, vídeo, áudio, PDF) dentro do navegador">📂 Arquivo</button>
  </div>
  <div class="row">
    <button id="b-sessao" class="primary">● Iniciar sessão</button>
    <button id="b-capturar" disabled title="Screenshot + página salva agora">📷 Capturar</button>
    <button id="b-nota" disabled title="Registrar observação no log">📝 Nota</button>
    <button id="b-anexar" disabled title="Anexar arquivo à sessão">📎 Anexar</button>
    <span id="status"><span class="dot" id="dot"></span><span id="status-txt">Sem sessão. Configure o operador e o certificado em ⚙ antes do primeiro uso.</span></span>
    <span style="flex:1"></span>
    <button id="b-sessoes" title="Sessões registradas no banco local">📁 Sessões</button>
    <button id="b-config" title="Configurações">⚙</button>
  </div>
</div>

<div id="panel"></div>
<video id="preview" muted style="display:none"></video>
<script src="renderer.js"></script>
</body>
</html>
